    <link rel="stylesheet" href="./public/gh-pages.css" />
    <style>
      @page {
        size: A4 landscape; /* Ép khổ A4 nằm ngang */
        margin: 6mm 8mm;
      }

      @media print {
        /* 1. Thiết lập toàn trang in */
        html, body {
          width: 100% !important;
          height: auto !important;
          margin: 0 !important;
          padding: 0 !important;
          background: #ffffff !important;
          color: #000000 !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
          font-size: 10pt !important;
        }

        /* 2. Mở khóa cuộn và ẩn các thành phần giao diện web không cần thiết khi in */
        *, *::before, *::after {
          overflow: visible !important;
          max-height: none !important;
          box-shadow: none !important;
        }

        header, nav, .sticky, .fixed, button, input, select, .no-print {
          display: none !important;
        }

        .print-only {
          display: block !important;
        }

        #table-view-container {
          display: block !important;
          width: 100% !important;
          page-break-inside: avoid !important;
          break-inside: avoid !important;
        }

        #card-view-container {
          display: none !important;
        }

        /* 3. Ép bảng thời khóa biểu hiển thị trọn vẹn 1 trang */
        table {
          width: 100% !important;
          min-width: 100% !important;
          max-width: 100% !important;
          table-layout: fixed !important;
          border-collapse: collapse !important;
          border: 1.5px solid #334155 !important;
        }

        th {
          padding: 5px 4px !important;
          border: 1px solid #334155 !important;
          background-color: #f1f5f9 !important;
          color: #0f172a !important;
          font-weight: 800 !important;
          text-align: center !important;
          font-size: 9.5pt !important;
        }

        td {
          border: 1px solid #94a3b8 !important;
          padding: 4px !important;
          vertical-align: top !important;
        }

        td:first-child {
          width: 65px !important;
          text-align: center !important;
          vertical-align: middle !important;
          font-weight: 800 !important;
          background-color: #f8fafc !important;
        }

        /* Định dạng thẻ môn học khi in */
        td div[class*="rounded"] {
          margin-bottom: 3px !important;
          padding: 4px 5px !important;
          border-width: 1px !important;
          border-radius: 4px !important;
          page-break-inside: avoid !important;
          break-inside: avoid !important;
        }

        .print-footer-summary {
          display: block !important;
          margin-top: 6px !important;
        }
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-teal-600 selection:text-white">
    <div id="root"></div>
    <div id="fallback-notice"></div>
    <script type="module" src="./public/gh-pages.js" onerror="handleLoadError()"></script>
    <script>
      function handleLoadError() {
        if (document.getElementById('root').innerHTML.trim() === '') {
          document.getElementById('fallback-notice').innerHTML = `
            <div style="padding:20px; font-family:sans-serif; max-width:650px; margin:30px auto; background:#fffbeb; border:1px solid #f59e0b; border-radius:10px; color:#92400e;">
              <strong>⚠️ Lưu ý khi mở file độc lập:</strong><br>
              Bạn đang mở file <code>index.html</code> mà thiếu thư mục <code>public/</code> đi kèm. Vui lòng đặt thư mục <code>public chứa gh-pages.js và gh-pages.css</code> nằm cùng cấp với file index.html này, hoặc sử dụng extension <b>Live Server</b> trên VS Code.
            </div>
          `;
        }
      }

      if (window.location.protocol === 'file:') {
        console.warn("Đang chạy ở chế độ cục bộ (file://). Đảm bảo thư mục public nằm cùng cấp.");
      }
    </script>
  </body>
</html>
